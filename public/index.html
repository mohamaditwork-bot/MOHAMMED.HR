<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>تسجيل الدخول — الموارد البشرية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="f" autocomplete="on">
      <img src="/logo-navy.png" alt="Novotel">
      <h1>لوحة الموارد البشرية</h1>
      <p class="sub">نوفوتيل المدينة المنورة</p>
      <div class="field">
        <label for="id">رقم الهوية / الإقامة</label>
        <input id="id" name="username" inputmode="numeric" autocomplete="username" required dir="ltr">
      </div>
      <div class="field">
        <label for="pw">كلمة المرور</label>
        <input id="pw" name="password" type="password" autocomplete="current-password" required dir="ltr">
      </div>
      <button class="btn block" id="go" type="submit">دخول</button>
      <p class="msg err" id="msg"></p>
      <div class="foot">الموارد البشرية والعلاقات الحكومية</div>
    </form>
  </div>
  <script>
    if (new URLSearchParams(location.search).has("idle")) {
      document.getElementById("msg").textContent = "تم قفل الصفحة بعد 30 دقيقة بدون نشاط — سجّل الدخول مرة ثانية";
    } else {
      fetch("/api/me").then(r => { if (r.ok) location.replace("/app.html"); });
    }
    const f = document.getElementById("f"), msg = document.getElementById("msg"), go = document.getElementById("go");
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = ""; go.disabled = true; go.textContent = "جاري الدخول...";
      try {
        const r = await fetch("/api/login", {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ id: document.getElementById("id").value.trim(), password: document.getElementById("pw").value })
        });
        const d = await r.json().catch(() => ({}));
        if (r.ok) return location.replace("/app.html");
        msg.textContent = d.error || "تعذر الدخول";
      } catch { msg.textContent = "تعذر الاتصال بالخادم"; }
      go.disabled = false; go.textContent = "دخول";
    });
  </script>
</body>
</html>
