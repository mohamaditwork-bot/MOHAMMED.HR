<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>الموارد البشرية</title>
  <script>
    (function () {
      var th = "light", lg = "ar";
      try {
        th = localStorage.getItem("hr_theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        lg = localStorage.getItem("hr_lang") === "en" ? "en" : "ar";
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", th);
      document.documentElement.lang = lg;
      document.documentElement.dir = lg === "ar" ? "rtl" : "ltr";
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/vendor/echarts.min.js"></script>
  <script src="/vendor/xlsx.full.min.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="side" id="side">
      <div class="brand">
        <img src="/logo-white.png" alt="Novotel">
        <small id="sideSub"></small>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="me" id="me"></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="btn ghost icon menu-btn" id="menuBtn" aria-label="menu">☰</button>
        <img class="logo" src="/logo-navy.png" alt="Novotel">
        <div class="ttl"><b id="topTitle"></b><span id="topSub"></span></div>
        <div class="spacer"></div>
        <div class="gsearch">
          <input class="input" id="gq" autocomplete="off">
          <div class="results hidden" id="gres"></div>
        </div>
        <button class="btn ghost sm" id="langBtn"></button>
        <button class="btn ghost icon" id="themeBtn" title=""><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 0 9 9c0-.5 0-.9-.1-1.4A5.5 5.5 0 0 1 13.4 3.1 9 9 0 0 0 12 3z"/></svg></button>
        <button class="btn ghost icon" id="printBtn" title=""><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 8H5a3 3 0 0 0-3 3v6h4v4h12v-4h4v-6a3 3 0 0 0-3-3zm-3 11H8v-5h8zm3-7a1 1 0 1 1 1-1 1 1 0 0 1-1 1zm-1-9H6v4h12z"/></svg></button>
      </header>
      <div class="print-head">
        <img src="/logo-navy.png" alt="Novotel">
        <div class="t"><b id="printTitle"></b><span id="printMeta"></span></div>
      </div>
      <div id="view"><div class="empty">…</div></div>
    </main>
  </div>
  <div id="modalRoot"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
